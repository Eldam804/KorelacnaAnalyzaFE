<mat-toolbar class="main-toolbar">

  <div class="brand">
    <mat-icon>hub</mat-icon>
    <span>Correlation Monoliths</span>
  </div>

  <div class="navigation">

    <button
      mat-button
      [class.active]="selectedGraphType === 'n-ptychs'"
      (click)="selectGraphType('n-ptychs')">

      <mat-icon>account_tree</mat-icon>
      N-ptychy
    </button>

    <button
      mat-button
      [class.active]="selectedGraphType === 'paths'"
      (click)="selectGraphType('paths')">

      <mat-icon>route</mat-icon>
      Cesty
    </button>

    <button
      mat-button
      [class.active]="selectedGraphType === 'hotspots'"
      (click)="selectGraphType('hotspots')">

      <mat-icon>flare</mat-icon>
      Hotspoty
    </button>

  </div>

  <span class="toolbar-spacer"></span>

  <div class="actions">

    <button
      mat-icon-button
      matTooltip="Pridať CSV"
      (click)="openAddFiles()">

      <mat-icon>upload_file</mat-icon>
    </button>

    <button
      mat-icon-button
      matTooltip="Debug"
      (click)="openDebugWindow()">

      <mat-icon>bug_report</mat-icon>
    </button>

  </div>

</mat-toolbar>


<main class="content">

  <app-graphs
    [graphType]="selectedGraphType"
    [graphData]="visualizationGraphData">
  </app-graphs>

</main>
