<mat-toolbar class="main-toolbar">

  <div class="brand">
    <mat-icon>hub</mat-icon>
    <span>Correlation Monoliths</span>
  </div>

  <div class="navigation">

   

  </div>

  <span class="toolbar-spacer"></span>

  <div class="actions">

    <button
      mat-icon-button
      matTooltip="Pridať CSV"
      (click)="openAddFiles()">

      <mat-icon>upload_file</mat-icon>
    </button>
    
    <button
      mat-icon-button
      matTooltip="Debug"
      (click)="openDebugWindow()">

      <mat-icon>bug_report</mat-icon>
    </button>

    <button
      mat-icon-button
      matTooltip="Export visualization as SVG"
      [disabled]="!graphData"
      (click)="exportVisualization()">

      <mat-icon>photo_camera</mat-icon>
    </button>

  </div>

</mat-toolbar>


<main class="content">

  <app-graphs
  [graphData]="graphData"
  [nPtychsData]="nPtychsData"
  [hotspotsData]="hotspotsData">
</app-graphs>

</main>
